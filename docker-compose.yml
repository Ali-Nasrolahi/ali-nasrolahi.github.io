name: hugo

services:
  main:
    image: ghcr.io/gohugoio/hugo:v0.167.0
    command: server --bind 0.0.0.0 --disableFastRender
    #command: ["sh"]
    userns_mode: keep-id
    volumes:
      - .:/project:z
    ports:
      - "1313:1313"

  nginx:
    image: nginx:latest
    volumes:
      - ./public:/usr/share/nginx/html:ro,z
    ports:
      - "8080:80"